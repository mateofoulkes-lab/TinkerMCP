services:
  - type: web
    name: tinkermcp
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npx playwright install --only-shell chromium && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TINKERMCP_HEADLESS
        value: "true"
      - key: TINKERMCP_PROFILE
        value: /tmp/tinkermcp-profile
